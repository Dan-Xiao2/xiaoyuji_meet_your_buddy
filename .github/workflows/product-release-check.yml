name: Product release check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:release
        env:
          TUTOR_ENABLE_LLM: "false"
          USE_CLOUD_TTS: "false"
          IMAGE_DRAWING_ENABLED: "false"
