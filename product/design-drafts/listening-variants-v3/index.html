<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小宇记 · 正在听设计方向</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="review-shell">
      <header class="review-heading">
        <span>小宇记 · 一起聊</span>
        <h1>“正在听”的四种画法</h1>
        <p>全部去掉轨道。只比较小宇如何让孩子感觉“它真的听见了”。</p>
      </header>

      <section class="variant-grid" aria-label="正在听的四种设计方向">
        <article class="variant-card is-recommended">
          <header class="variant-heading">
            <span>A</span>
            <div>
              <h2>只让小宇呼吸</h2>
              <p>最简洁，也最不容易过时</p>
            </div>
            <strong>推荐</strong>
          </header>
          <section class="phone-frame" aria-label="小宇呼吸方案">
            <header class="app-bar">
              <button type="button">素素 <span>⌄</span></button>
              <button type="button">结束</button>
            </header>
            <div class="listening-paper variant-breathe">
              <button class="listener-button" type="button" aria-label="正在听，说完松开">
                <span class="soft-shadow" aria-hidden="true"></span>
                <span class="listener-character">
                  <img src="../../assets/xiaoyu-planet.png" alt="" />
                </span>
              </button>
              <strong>我在听</strong>
              <span>说完松开</span>
            </div>
          </section>
        </article>

        <article class="variant-card">
          <header class="variant-heading">
            <span>B</span>
            <div>
              <h2>蜡笔回声</h2>
              <p>声音出现时，短线像孩子随手画出来</p>
            </div>
          </header>
          <section class="phone-frame" aria-label="蜡笔回声方案">
            <header class="app-bar">
              <button type="button">素素 <span>⌄</span></button>
              <button type="button">结束</button>
            </header>
            <div class="listening-paper variant-crayon">
              <button class="listener-button" type="button" aria-label="正在听，说完松开">
                <svg class="crayon-feedback" viewBox="0 0 300 270" aria-hidden="true"></svg>
                <span class="listener-character">
                  <img src="../../assets/xiaoyu-planet.png" alt="" />
                </span>
              </button>
              <strong>我在听</strong>
              <span>说完松开</span>
            </div>
          </section>
        </article>

        <article class="variant-card">
          <header class="variant-heading">
            <span>C</span>
            <div>
              <h2>纸面晕染</h2>
              <p>声音让背后的颜色像水彩一样慢慢展开</p>
            </div>
          </header>
          <section class="phone-frame" aria-label="纸面晕染方案">
            <header class="app-bar">
              <button type="button">素素 <span>⌄</span></button>
              <button type="button">结束</button>
            </header>
            <div class="listening-paper variant-wash">
              <button class="listener-button" type="button" aria-label="正在听，说完松开">
                <svg class="paper-wash" viewBox="0 0 300 280" aria-hidden="true"></svg>
                <span class="listener-character">
                  <img src="../../assets/xiaoyu-planet.png" alt="" />
                </span>
              </button>
              <strong>我在听</strong>
              <span>说完松开</span>
            </div>
          </section>
        </article>

        <article class="variant-card">
          <header class="variant-heading">
            <span>D</span>
            <div>
              <h2>轻轻点头</h2>
              <p>像伙伴一样前后回应，不增加新图案</p>
            </div>
          </header>
          <section class="phone-frame" aria-label="轻轻点头方案">
            <header class="app-bar">
              <button type="button">素素 <span>⌄</span></button>
              <button type="button">结束</button>
            </header>
            <div class="listening-paper variant-nod">
              <button class="listener-button" type="button" aria-label="正在听，说完松开">
                <span class="soft-shadow" aria-hidden="true"></span>
                <span class="listener-character">
                  <img src="../../assets/xiaoyu-planet.png" alt="" />
                </span>
              </button>
              <strong>我在听</strong>
              <span>说完松开</span>
            </div>
          </section>
        </article>
      </section>

      <footer class="review-note">
        <strong>共同原则</strong>
        <span>没有轨道 · 没有技术声波 · 没有加载动画 · 动效只回应声音</span>
      </footer>
    </main>
    <script src="/node_modules/motion/dist/motion.js"></script>
    <script src="/node_modules/roughjs/bundled/rough.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
